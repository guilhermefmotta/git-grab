name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
            args: ""
          - platform: macos-latest
            label: macos-arm
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macos-intel
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            label: windows
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup MSVC dev tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WiX Toolset v4 (Windows)
        if: matrix.platform == 'windows-latest'
        run: dotnet tool install --global wix

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install nsis --no-progress -y

      - name: Add NASM to PATH (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Git Crab ${{ github.ref_name }}"
          releaseBody: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Linux | `.AppImage` or `.deb` |
            | macOS (Apple Silicon) | `.dmg` (arm) |
            | macOS (Intel) | `.dmg` (x64) |
            | Windows | `.msi` or `.exe` |

            See assets below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
